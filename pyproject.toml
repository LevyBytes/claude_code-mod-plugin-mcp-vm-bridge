[project]
name = "claude-code-mod-orchestration-vm-bridge"
version = "0.3.0"
requires-python = ">=3.12"
description = "Claude mod, sidebar companion and host MCP bridge"
license = "Apache-2.0"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"
